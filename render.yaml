services:
  - type: web
    name: dealerdesk-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py seed_data && gunicorn dealerdesk.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dealerdesk-db
          property: connectionString
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPPLIER_API_URL
        sync: false
      - key: SUPPLIER_API_KEY
        sync: false

databases:
  - name: dealerdesk-db
    plan: free
    databaseName: dealerdesk
    user: dealerdesk
