version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: dealerdesk_postgres
    environment:
      POSTGRES_DB: dealerdesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dealerdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: dealerdesk_api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/dealerdesk
      DJANGO_SECRET_KEY: docker-local-secret-key
      DJANGO_DEBUG: "1"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SUPPLIER_API_URL: ${SUPPLIER_API_URL:-}
      SUPPLIER_API_KEY: ${SUPPLIER_API_KEY:-}

volumes:
  pgdata:
